<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Devis — Aubrac VTC</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172231;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px;background:#101b2b;color:white;border-radius:0 0 24px 24px}header small{color:#d6b987;letter-spacing:2px;font-weight:bold}main{max-width:760px;margin:auto;padding:16px}.card,.booking{background:white;border:1px solid #e4e8ee;border-radius:16px;padding:16px;margin:12px 0}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #d6dde7;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:13px 15px;font-size:15px;font-weight:750;cursor:pointer;background:#101b2b;color:white}button:disabled{opacity:.5}.wide{width:100%;margin-top:14px}.muted{color:#697586;font-size:13px;line-height:1.5}.status{white-space:pre-wrap;margin-top:10px;font-size:14px;color:#9d2922}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:12px;color:#72572c;background:#f7f1e5;border-radius:30px;padding:5px 8px}.hidden{display:none!important}.price{display:flex;gap:8px;align-items:end}.price>div{flex:1}a{color:#72572c}</style></head><body><header><small>AUBRAC VTC · ESPACE CHAUFFEUR</small><h1>Mes demandes & devis</h1><p>Fixe ton tarif et envoie-le au client par e-mail.</p></header><main><section id="login" class="card"><h2>Connexion chauffeur</h2><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password"><button id="loginButton" class="wide" onclick="loginNow()">Se connecter</button><div id="loginMsg" class="status"></div></section><section id="app" class="hidden"><div class="card"><div class="top"><h2>Demandes reçues</h2><button onclick="loadBookings()">Actualiser</button></div><p id="profile" class="muted"></p><div id="list"></div><div id="appMsg" class="status"></div><a href="reservations.html">Ouvrir l’espace réservations</a><button class="wide" onclick="logoutNow()">Déconnexion</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://dvdbzaneegpgolvioybh.supabase.co',KEY='sb_publishable_tOYIlu5gDufGjtfU1xHvHQ_tA8-C3xY';let client=null,session=null,driver=null;const el=id=>document.getElementById(id);const show=(id,s)=>el(id).textContent=s||'';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loginNow(){const b=el('loginButton');b.disabled=true;show('loginMsg','Connexion en cours…');try{if(!window.supabase)throw Error('Le module de connexion ne se charge pas. Recharge la page.');client=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'aubrac-vtc-quotes-auth'}});const {data,error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)throw error;session=data.session;const r=await client.from('vtc_drivers').select('*').eq('user_id',session.user.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Profil chauffeur introuvable.');driver=r.data;el('login').classList.add('hidden');el('app').classList.remove('hidden');show('profile','Connecté : '+driver.display_name);await loadBookings()}catch(e){show('loginMsg','Connexion impossible : '+e.message)}finally{b.disabled=false}}async function loadBookings(){show('appMsg','Chargement…');try{const {data,error}=await client.from('vtc_booking_requests').select('*').eq('driver_id',driver.id).order('created_at',{ascending:false});if(error)throw error;el('list').innerHTML=(data||[]).map(x=>{const canQuote=['pending','quoted'].includes(x.status);return '<article class="booking"><div class="top"><strong>'+esc(x.client_name)+'</strong><span class="pill">'+esc(statusLabel(x.status))+'</span></div><p>'+esc(x.pickup_date)+' à '+esc(String(x.pickup_time).slice(0,5))+' · '+esc(x.passengers)+' passager(s)</p><p><b>Départ :</b> '+esc(x.pickup_address)+'<br><b>Destination :</b> '+esc(x.destination_address)+'</p><p><b>Téléphone :</b> '+esc(x.client_phone)+'<br><b>E-mail :</b> '+esc(x.client_email||'Non renseigné')+'</p>'+(x.client_message?'<p><b>Précisions :</b> '+esc(x.client_message)+'</p>':'')+(x.quoted_price!=null?'<p><b>Dernier tarif proposé :</b> '+Number(x.quoted_price).toFixed(2).replace('.',',')+' €</p>':'')+(canQuote?'<label for="price_'+x.id+'">Tarif à proposer (€)</label><input id="price_'+x.id+'" type="number" min="0.01" max="100000" step="0.01" placeholder="Ex. 85,00" value="'+(x.quoted_price??'')+'"><button class="wide" id="send_'+x.id+'" onclick="sendQuote(\''+x.id+'\')">'+(x.status==='quoted'?'Renvoyer le devis':'Envoyer le devis par e-mail')+'</button>':'')+'</article>'}).join('')||'<p class="muted">Aucune demande pour le moment.</p>';show('appMsg','')}catch(e){show('appMsg','Impossible de charger les demandes : '+e.message)}}function statusLabel(s){return ({pending:'Demande reçue',quoted:'Devis envoyé · en attente',accepted:'Devis accepté',rejected:'Devis refusé',cancelled:'Annulée'})[s]||s}async function sendQuote(id){const input=el('price_'+id),button=el('send_'+id),price=Number(input.value);if(!Number.isFinite(price)||price<=0){show('appMsg','Entre un tarif supérieur à 0 €.');return}if(!confirm('Envoyer un devis de '+price.toFixed(2).replace('.',',')+' € au client ?'))return;button.disabled=true;button.textContent='Envoi…';show('appMsg','Enregistrement et envoi du devis…');try{const {data,error}=await client.functions.invoke('manage-vtc-quote',{body:{action:'quote',booking_id:id,price}});if(error)throw error;if(data?.error)throw Error(data.error);show('appMsg','Devis envoyé au client par e-mail.');await loadBookings()}catch(e){show('appMsg','Impossible d’envoyer le devis : '+(e.message||String(e)))}finally{if(button){button.disabled=false;button.textContent='Envoyer le devis par e-mail'}}}async function logoutNow(){if(client)await client.auth.signOut();location.reload()}</script></body></html>
