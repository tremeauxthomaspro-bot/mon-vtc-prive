<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Réponse au devis — Aubrac VTC</title><style>body{margin:0;background:#f4f6f8;color:#172231;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#101b2b;color:white;padding:28px 20px;border-radius:0 0 24px 24px}header small{color:#d6b987;letter-spacing:2px;font-weight:bold}main{max-width:600px;margin:auto;padding:18px}.card{background:white;border:1px solid #e4e8ee;border-radius:18px;padding:22px;margin-top:18px}button{border:0;border-radius:10px;padding:14px 18px;background:#101b2b;color:white;font-size:16px;font-weight:bold;width:100%}.muted{color:#697586;line-height:1.5}.status{white-space:pre-wrap;line-height:1.5}</style></head><body><header><small>AUBRAC VTC · CHAUFFEUR PRIVÉ</small><h1>Réponse à votre devis</h1></header><main><section class="card"><p id="message" class="status">Vérification du lien…</p><p class="muted">Votre réponse sera transmise au chauffeur. En cas de problème, contactez directement Aubrac VTC.</p><button id="retry" hidden onclick="sendResponse()">Réessayer</button></section></main><script>const URL='https://dvdbzaneegpgolvioybh.supabase.co';const KEY='sb_publishable_tOYIlu5gDufGjtfU1xHvHQ_tA8-C3xY';const params=new URLSearchParams(location.search);const token=params.get('token');const choice=params.get('choice');const msg=document.getElementById('message');const btn=document.getElementById('retry');async function sendResponse(){btn.hidden=true;msg.textContent='Enregistrement de votre réponse…';try{const r=await fetch(URL+'/functions/v1/manage-vtc-quote',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action:'respond',token,choice})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Une erreur est survenue.');msg.textContent=choice==='accepted'?'Merci ! Vous avez accepté le devis. Votre réservation est confirmée et transmise au chauffeur.':'Votre refus a bien été transmis au chauffeur. Merci de nous avoir prévenus.';}catch(e){msg.textContent=e.message||'Impossible d’enregistrer votre réponse.';btn.hidden=false;}}if(!token||!['accepted','rejected'].includes(choice)){msg.textContent='Ce lien de réponse est incomplet ou invalide.';}else sendResponse();</script></body></html>
